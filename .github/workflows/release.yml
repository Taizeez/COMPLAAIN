name: Build and Publish Complaain Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Standalone Binaries & Bundles
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Standalone Offline HTML
        run: |
          python compile_standalone.py

      - name: Build Standalone Windows Executable (.exe - Single File)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Complaain-Windows" `
            --add-data "index.html;." `
            --add-data "css;css" `
            --add-data "js;js" `
            --add-data "manifest.json;." `
            --add-data "version.json;." `
            complaain.py

      - name: Upload Single-File Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            complaain-portable-offline.html
            dist/Complaain-Windows.exe
          draft: false
          prerelease: false
          generate_release_notes: true
